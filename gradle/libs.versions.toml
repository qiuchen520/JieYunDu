# 文件：libs.versions.toml
# 职责：Gradle Version Catalog，集中声明所有依赖与插件版本
# 依赖：无
# 协议：AGPL-3.0

[versions]
agp = "8.2.2"
kotlin = "1.9.22"
ksp = "1.9.22-1.0.17"
composeBom = "2024.02.01"
composeCompiler = "1.5.8"
coreKtx = "1.12.0"
activityCompose = "1.8.2"
lifecycle = "2.7.0"
hilt = "2.50"
hiltNavigationCompose = "1.1.0"
room = "2.6.1"
okhttp = "4.12.0"
retrofit = "2.9.0"
retrofitKotlinxSerialization = "1.0.0"
coil = "2.5.0"
cloudy = "1.0.0-alpha01"
timber = "5.0.1"
kotlinxSerialization = "1.6.3"
coroutines = "1.7.3"

# SDK 档位（要求.md 第五部分）
compileSdk = "34"
minSdk = "26"
targetSdk = "34"

[libraries]
# --- AndroidX 基础 ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# --- Compose（版本由 BOM 统一管理）---
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
# 注意：别名不能含 Gradle 保留字（class / extensions / convention），否则构建期报
# "is not a valid alias"。故此处用 window-size（而非 window-size-class）。
androidx-compose-material3-window-size = { module = "androidx.compose.material3:material3-window-size-class" }

# --- Hilt ---
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# --- Room ---
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

# --- 网络 ---
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxSerialization" }

# --- 序列化 / 协程 ---
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# --- 图片 / 玻璃效果 / 日志 ---
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
cloudy = { module = "com.github.skydoves:cloudy", version.ref = "cloudy" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

# --- 测试（Apache-2.0；使用 kotlin-test 而非 junit，规避 EPL-1.0）---
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
