name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 说明：gradle-wrapper.jar 是二进制文件，无法经由本次交付所用的 MCP 文本接口推送，
      # 因此 CI 不依赖 wrapper，改用官方 setup-gradle 固定 Gradle 8.2.1（与
      # gradle/wrapper/gradle-wrapper.properties 中声明的版本一致）。
      # 注意：Gradle 官方无 8.2.2 发行版（8.2.2 是 AGP 的版本号，两者不同），此处必须用 8.2.1。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jieyundu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 单元测试步骤（整改指令硬伤 2）：只跑本地 JVM 单元测试，全程用测试替身、不触网。
      # 放在 APK 上传之后，保证即便测试失败也能先下载到 APK 产物用于诊断。
      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace